name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cyberpunk_notes
            asset_name: cyberpunk_notes-linux-amd64
          - os: windows-latest
            artifact_name: cyberpunk_notes.exe
            asset_name: cyberpunk_notes-windows-amd64.exe
          - os: macos-latest
            artifact_name: cyberpunk_notes
            asset_name: cyberpunk_notes-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev

      - name: Build
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/cyberpunk_notes-linux-amd64/cyberpunk_notes
            artifacts/cyberpunk_notes-windows-amd64.exe/cyberpunk_notes.exe
            artifacts/cyberpunk_notes-macos-amd64/cyberpunk_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
